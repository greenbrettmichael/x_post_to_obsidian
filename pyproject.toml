[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-post-to-obsidian"
version = "0.1.0"
description = "Research X bookmarks and build a linked, cited Obsidian knowledge base"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<4", "httpx>=0.27,<1", "pydantic>=2.9,<3", "trafilatura>=2,<3", "pypdf>=5,<7", "imageio-ffmpeg>=0.6,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
local-audio = ["faster-whisper>=1.1,<2", "av>=11,<17"]
dev = ["pytest>=8,<10"]

[project.scripts]
x2o = "x2o.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
x2o = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
